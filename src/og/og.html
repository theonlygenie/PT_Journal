<!doctype html>
<html><head><meta charset="utf-8"><title>PT Journal share image</title>
<style>
@font-face{font-family:"Archivo Black";src:url(../../shared/renderer/fonts/archivo-black-latin.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"Figtree";src:url(../../shared/renderer/fonts/figtree-latin.woff2) format("woff2");font-weight:300 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#ffb200;font-family:"Figtree",sans-serif;color:#000;position:relative;
  background-image:linear-gradient(#00000040 2px,transparent 2px),linear-gradient(90deg,#00000040 2px,transparent 2px);background-size:60px 60px;background-position:-1px -1px}
.brand{position:absolute;left:64px;top:48px;display:flex;align-items:center;gap:14px;font-family:"Archivo Black";font-size:34px;letter-spacing:-.03em}
.brand svg{width:50px;height:50px}
.brand small{font-family:"Figtree";font-weight:700;font-size:15px;letter-spacing:.14em;margin-left:6px;opacity:.75}
h1{position:absolute;left:64px;top:168px;font-family:"Archivo Black";font-weight:900;font-size:112px;line-height:.95;letter-spacing:-.05em}
h1 span{display:block}h1 .l2{padding-left:96px}
.glyph{position:absolute;left:600px;top:232px;width:46px;height:46px}
.foot{position:absolute;left:64px;bottom:46px;font-weight:700;font-size:23px}
.card{position:absolute;right:34px;top:206px;width:408px;transform:rotate(3deg);background:#fff;border-radius:28px;padding:12px;box-shadow:0 18px 40px #0003}
.card img{display:block;width:100%;border-radius:18px}
</style></head>
<body>
<div class="brand">
  <svg viewBox="0 0 48 48"><defs><clipPath id="b"><circle cx="24" cy="24" r="22"/></clipPath></defs><g clip-path="url(#b)"><rect width="48" height="24" fill="#ea3737"/><rect y="24" width="48" height="24" fill="#f4f1ea"/></g><circle cx="24" cy="24" r="22" fill="none" stroke="#14110f" stroke-width="3"/><rect x="2" y="22.5" width="44" height="3" fill="#14110f"/><circle cx="24" cy="24" r="9.5" fill="#f4f1ea" stroke="#14110f" stroke-width="3"/><text x="24" y="27.6" text-anchor="middle" font-size="10.5" font-weight="800" fill="#14110f" font-family="Figtree">PT</text></svg>
  PT Journal <small>FOR PLATINUM TOGETHER</small>
</div>
<h1><span>Your way</span><span class="l2">of playing.</span></h1>
<svg class="glyph" id="g" viewBox="0 0 17 17"></svg>
<div class="foot">Free · reads your game on your PC · nothing uploaded</div>
<div class="card"><img src="../landing/img/shiny-luck.jpg" alt=""></div>
<script>
// the pixel Poké Ball beside the headline
const g=document.getElementById('g'),NS='http://www.w3.org/2000/svg',N=17,c=8;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const r=Math.hypot(x-c,y-c);if((r>=6.6&&r<8.4)||(y===c&&r<6.6&&r>=3.7)||(r>=2.2&&r<3.7)){const e=document.createElementNS(NS,'rect');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('width',1);e.setAttribute('height',1);e.setAttribute('fill','#000');g.appendChild(e);}}
</script>
</body></html>
